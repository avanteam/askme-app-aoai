# Default values for askme chart
# Secrets removed for security reasons - to be configured during deployment

# Ingress configuration for automatic SSL certificate generation
ingress:
  enabled: true
  className: nginx
  host: ""  # Will be set during Rancher deployment
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    kubernetes.io/ingress.class: "nginx"
  tls:
    enabled: true
