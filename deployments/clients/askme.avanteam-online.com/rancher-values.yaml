# Configuration Rancher activée pour askme.avanteam-online.com
rancher:
  enabled: true
  clusterName: "askme-prod-cluster"
  managementNamespace: "cattle-system"
  
  # Quotas adaptés au type de client
  resourceQuota:
    cpu: "2000m"
    memory: "4Gi"
    storage: "10Gi"
  
  rbac:
    enabled: true
    annotations:
      field.cattle.io/projectId: "c-m-g8b9wrhd:askme-askme"
    additionalUsers:
      - name: "admin@avanteam.com"
      - name: "devops@avanteam.com"
  
  monitoring:
    enabled: true
    projectId: "c-m-g8b9wrhd:askme-askme"
  
  alerting:
    enabled: true
    recipients:
      - email: "admin@avanteam.com"
