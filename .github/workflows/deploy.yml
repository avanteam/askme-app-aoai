name: 🚀 Deploy AskMe to OVH Kubernetes

on:
  push:
    branches: [ prod, test-rg2 ]  # Développement et tests
    tags: [ 'v*' ]  # Release production depuis branche prod
  pull_request:
    branches: [ prod ]

env:
  REGISTRY_URL: 7wpjr0wh.c1.gra9.container-registry.ovh.net
  IMAGE_NAME: askme/askme-app
  KUBERNETES_NAMESPACE: askme-platform

jobs:
  # Job 1: Frontend Tests et Linting
  test:
    name: 🧪 Frontend Tests & Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4

    - name: 📱 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: 📦 Installation des dépendances Node.js
      working-directory: ./frontend
      run: npm ci

    - name: 🧪 Tests Frontend
      working-directory: ./frontend
      run: npm run test -- --passWithNoTests

  # Job 2: Build et Push de l'image Docker
  build:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    # Seulement sur prod (staging) et tags (production) - PAS sur test-rg2
    if: github.event_name == 'push' && (github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/v'))
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.docker.outputs.digest }}
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4

    - name: 🏷️ Extraction des métadonnées
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix=sha-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: 🔐 Connexion au Harbor Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY_URL }}
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}

    - name: 🏗️ Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
 
    - name: 🐳 Build et Push de l'image
      id: docker
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./WebApp.Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Job 3: Mise à jour du Rancher Catalog (sans tags)
  update-catalog:
    name: 📦 Update Rancher Catalog (Simplified)
    runs-on: ubuntu-latest
    needs: build
    # UNIQUEMENT sur les tags de version (release depuis branche prod)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: 🏷️ Extract version from tag
      id: version
      run: |
        # Extraire la version du tag (ex: refs/tags/v1.0.0 → 1.0.0)
        VERSION=${GITHUB_REF#refs/tags/}
        VERSION=${VERSION#v}  # Remove 'v' prefix if present
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "📋 Version release détectée: ${VERSION}"

    - name: 📥 Checkout Rancher Catalog Repository
      uses: actions/checkout@v4
      with:
        repository: avanteam/askme-rancher-catalog
        ref: prod  # Utilisation de la branche prod (branche de déploiement)
        token: ${{ secrets.ASKME_CATALOG_SYNC }}
        path: rancher-catalog

    - name: 🛠️ Setup Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'

    - name: 🔄 Update Chart with Helm commands
      run: |
        cd rancher-catalog/charts/askme
        
        echo "📝 Mise à jour Chart.yaml avec Helm..."
        # Update Chart version and appVersion
        sed -i "s/^version:.*/version: ${{ steps.version.outputs.version }}/" Chart.yaml
        sed -i "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.version }}\"/" Chart.yaml
        
        # Update upstream-version in annotations
        sed -i "s/catalog.cattle.io\/upstream-version: \".*\"/catalog.cattle.io\/upstream-version: \"${{ steps.version.outputs.version }}\"/" Chart.yaml
        
        # Update release notes in changes annotation (approche simplifiée)
        echo "📝 Mise à jour des notes de version..."
        # Note: On ajoute simplement une note basique, le formatage complet sera fait manuellement si nécessaire
        sed -i "/catalog.cattle.io\/changes: |/a\\    v${{ steps.version.outputs.version }}: Mise à jour automatique via CI/CD" Chart.yaml
        
        echo "📝 Mise à jour values.yaml..."
        # Update image tag in values.yaml
        sed -i "s/tag: \".*\"/tag: \"${{ steps.version.outputs.version }}\"/" values.yaml
        
        echo "🔧 Application des corrections de robustesse..."
        # S'assurer que pullPolicy est Always pour forcer le rechargement
        sed -i "s/pullPolicy: .*/pullPolicy: Always  # CRITIQUE: Force le rechargement des nouvelles images lors des upgrades/" values.yaml
        
        echo "✅ Fichiers mis à jour:"
        echo "- Chart.yaml: $(grep '^version:' Chart.yaml)"
        echo "- Chart.yaml: $(grep '^appVersion:' Chart.yaml)"
        echo "- values.yaml: $(grep 'tag:' values.yaml)"


    - name: 📦 Package Chart and Update Index (Differential)
      run: |
        cd rancher-catalog
        VERSION="${{ steps.version.outputs.version }}"
        
        echo "📦 Création du nouveau package v${VERSION}..."
        helm package charts/askme --destination .
        
        # Vérifier que le package a été créé
        if [[ ! -f "askme-${VERSION}.tgz" ]]; then
          echo "❌ Échec de création du package askme-${VERSION}.tgz"
          exit 1
        fi
        
        echo "📝 Mise à jour différentielle de l'index (préservation de l'historique)..."
        # Approche différentielle : merge avec l'index existant
        helm repo index . --merge index.yaml \
          --url https://raw.githubusercontent.com/avanteam/askme-rancher-catalog/prod
        
        echo "✅ Package créé et index mis à jour :"
        echo "- Nouveau package: askme-${VERSION}.tgz ($(stat -c%s askme-${VERSION}.tgz) bytes)"
        echo "- Index mis à jour avec $(grep -c 'version:' index.yaml) versions"
        
        # Vérification rapide de l'intégrité
        if grep -q "version: ${VERSION}" index.yaml; then
          echo "✅ Version ${VERSION} correctement ajoutée à l'index"
        else
          echo "❌ Version ${VERSION} introuvable dans l'index!"
          exit 1
        fi

    - name: 🚀 Commit and Push to Catalog
      run: |
        cd rancher-catalog
        
        git config user.name "AskMe Release Bot"
        git config user.email "noreply@avanteam.com"
        
        # Check if there are changes to commit
        if git diff --quiet && git diff --staged --quiet; then
          echo "📋 Aucun changement détecté dans le catalog"
          exit 0
        fi
        
        git add .
        git commit -m "🚀 chore: update AskMe to version ${{ steps.version.outputs.version }}
        
        📦 Core Updates:
        - Updated Chart.yaml version and appVersion to ${{ steps.version.outputs.version }}
        - Updated catalog.cattle.io/upstream-version to ${{ steps.version.outputs.version }}
        - Added automated release notes to catalog.cattle.io/changes
        - Updated values.yaml image tag to ${{ steps.version.outputs.version }}
        
        🔧 Robustness Improvements:
        - Enforced pullPolicy: Always for reliable image updates
        - Enhanced DNS job with retry logic and fallback mechanisms
        - Added deployment restart annotations for ConfigMap changes
        - Cleaned up ConfigMap duplications
        
        📋 Package Management:
        - Generated new Helm package askme-${{ steps.version.outputs.version }}.tgz
        - Updated index.yaml using differential approach (--merge) to preserve history
        - Synchronized with AskMe tag v${{ steps.version.outputs.version }}
        
        🤖 Auto-generated by GitHub Actions (Robust Deployment)
        Source: ${{ github.repository }}@${{ github.sha }}"
        
        # Push vers prod (simple et direct)
        echo "🔄 Push des changements vers prod..."
        if git push origin HEAD:prod 2>/dev/null; then
          echo "✅ Push vers prod réussi"
          echo "📦 Catalog mis à jour: askme-${{ steps.version.outputs.version }}.tgz disponible"
        else
          echo "⚠️ Push vers prod échoué (conflit possible)"
          echo "📋 Action manuelle requise pour merger vers prod"
          exit 1
        fi

  # Job 4: Notification de build
  notify:
    name: 📢 Notification
    runs-on: ubuntu-latest
    needs: [test, build, update-catalog]
    # Seulement si des jobs build ont été exécutés
    if: always() && needs.build.result != 'skipped'
    
    steps:
    - name: 📧 Notification de succès
      if: needs.build.result == 'success'
      run: |
        echo "✅ Build réussi !"
        echo "🐳 Image Docker : ${{ needs.build.outputs.image-tag }}"
        echo "📦 Image disponible dans Harbor Registry"
        
        if [[ "${{ needs.update-catalog.result }}" == "success" ]]; then
          echo "📦 Catalog Rancher mis à jour avec succès (sans tag)"
          echo "🌐 Nouvelle version disponible dans Rancher UI"
          echo "🔗 URL: https://raw.githubusercontent.com/avanteam/askme-rancher-catalog/prod/index.yaml"
        elif [[ "${{ needs.update-catalog.result }}" == "skipped" ]]; then
          echo "📦 Synchronisation catalog ignorée (push sur branche, pas tag)"
        else
          echo "⚠️ Problème avec la synchronisation du catalog"
        fi

    - name: 📧 Notification d'échec
      if: needs.build.result == 'failure'
      run: |
        echo "❌ Build échoué !"
        echo "🔍 Vérifiez les logs des étapes précédentes"