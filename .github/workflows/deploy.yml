name: 🚀 Deploy AskMe to OVH Kubernetes

on:
  push:
    branches: [ prod, test-rg2 ]  # Développement et tests
    tags: [ 'v*' ]  # Release production depuis branche prod
  pull_request:
    branches: [ prod ]

env:
  REGISTRY_URL: 7wpjr0wh.c1.gra9.container-registry.ovh.net
  IMAGE_NAME: askme/askme-app
  KUBERNETES_NAMESPACE: askme-platform

jobs:
  # Job 1: Frontend Tests et Linting
  test:
    name: 🧪 Frontend Tests & Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4

    # Python setup supprimé - non nécessaire pour frontend tests/linting uniquement
    # Les tests Python nécessitent des clés API LLM et doivent être exécutés localement
    # - name: 🐍 Setup Python
    #   uses: actions/setup-python@v4
    #   with:
    #     python-version: '3.11'
    # - name: 📦 Installation des dépendances Python
    #   run: |
    #     python -m pip install --upgrade pip
    #     pip install -r requirements.txt
    # - name: 🧪 Tests Python
    #   run: |
    #     python -m pytest tests/ -v

    - name: 📱 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: 📦 Installation des dépendances Node.js
      working-directory: ./frontend
      run: npm ci

    - name: 🧪 Tests Frontend
      working-directory: ./frontend
      run: npm run test -- --passWithNoTests


  # Job 2: Build et Push de l'image Docker
  build:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    # Seulement sur prod (staging) et tags (production) - PAS sur test-rg2
    if: github.event_name == 'push' && (github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/v'))
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.docker.outputs.digest }}
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4

    - name: 🏷️ Extraction des métadonnées
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix=sha-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: 🔐 Connexion au Harbor Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY_URL }}
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}

    - name: 🏗️ Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🐳 Build et Push de l'image
      id: docker
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./WebApp.Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Job 3: Synchronisation du Rancher Catalog avec Tags
  update-catalog:
    name: 📦 Update Rancher Catalog (Synchronized Tags)
    runs-on: ubuntu-latest
    needs: build
    # UNIQUEMENT sur les tags de version (release depuis branche prod)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: 🏷️ Extract version from tag
      id: version
      run: |
        # Extraire la version du tag (ex: refs/tags/v1.0.0 → 1.0.0)
        VERSION=${GITHUB_REF#refs/tags/}
        VERSION=${VERSION#v}  # Remove 'v' prefix if present
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "📋 Version release détectée: ${VERSION}"

    - name: 📥 Checkout Rancher Catalog Repository
      uses: actions/checkout@v4
      with:
        repository: avanteam/askme-rancher-catalog
        ref: prod  # Utilisation de la branche prod (branche de déploiement)
        token: ${{ secrets.ASKME_CATALOG_SYNC }}
        path: rancher-catalog

    - name: 🛠️ Setup Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'

    - name: 🔄 Update Chart with Helm commands
      run: |
        cd rancher-catalog/charts/askme
        
        echo "📝 Mise à jour Chart.yaml avec Helm..."
        # Update Chart version and appVersion
        sed -i "s/^version:.*/version: ${{ steps.version.outputs.version }}/" Chart.yaml
        sed -i "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.version }}\"/" Chart.yaml
        
        echo "📝 Mise à jour values.yaml..."
        # Update image tag in values.yaml
        sed -i "s/tag: \".*\"/tag: \"${{ steps.version.outputs.version }}\"/" values.yaml
        
        echo "✅ Fichiers mis à jour:"
        echo "- Chart.yaml: $(grep '^version:' Chart.yaml)"
        echo "- Chart.yaml: $(grep '^appVersion:' Chart.yaml)"
        echo "- values.yaml: $(grep 'tag:' values.yaml)"

    - name: 📦 Restore Previous Chart Packages
      run: |
        cd rancher-catalog
        echo "📦 Récupération des packages existants pour conserver toutes les versions..."
        
        # Récupérer tous les packages .tgz depuis l'historique git
        git log --name-only --pretty=format: | grep '\.tgz$' | sort | uniq | while read tgz_file; do
          if [[ -n "$tgz_file" ]] && [[ ! -f "$tgz_file" ]]; then
            echo "🔄 Récupération de $tgz_file depuis l'historique..."
            # Essayer de récupérer le fichier depuis l'historique
            git checkout HEAD~1 -- "$tgz_file" 2>/dev/null || \
            git checkout HEAD~2 -- "$tgz_file" 2>/dev/null || \
            git checkout HEAD~3 -- "$tgz_file" 2>/dev/null || \
            git checkout HEAD~5 -- "$tgz_file" 2>/dev/null || \
            git checkout HEAD~10 -- "$tgz_file" 2>/dev/null || \
            echo "⚠️ Impossible de récupérer $tgz_file"
          fi
        done
        
        echo "📋 Packages disponibles:"
        ls -la *.tgz 2>/dev/null || echo "Aucun package trouvé"

    - name: 📦 Package Chart and Update Index
      run: |
        cd rancher-catalog
        echo "📦 Package du chart Helm..."
        
        # Package the chart (nouvelle version)
        helm package charts/askme --destination .
        
        echo "📝 Génération de l'index Helm avec TOUTES les versions..."
        # Vérifier si index.yaml existe et contient des données
        if [[ -f "index.yaml" ]] && grep -q "entries:" index.yaml; then
          echo "✅ index.yaml existant trouvé, fusion avec les nouvelles versions..."
          # Merge avec l'index existant - URL corrigée vers raw.githubusercontent.com  
          helm repo index . --url https://raw.githubusercontent.com/avanteam/askme-rancher-catalog/prod --merge index.yaml
        else
          echo "🆕 Création d'un nouvel index.yaml..."
          # Créer un nouvel index - URL corrigée vers raw.githubusercontent.com
          helm repo index . --url https://raw.githubusercontent.com/avanteam/askme-rancher-catalog/prod
        fi
        
        echo "✅ Packages disponibles:"
        ls -la askme-*.tgz | wc -l | xargs echo "Nombre de packages:"
        ls -la askme-*.tgz
        
        echo "📋 Versions dans l'index:"
        if command -v yq >/dev/null 2>&1; then
          yq eval '.entries.askme[].version' index.yaml | sort -V || echo "Erreur yq"
        else
          grep -o 'version: [0-9.]*' index.yaml | head -10
        fi

    - name: 🚀 Commit and Create Synchronized Tag
      run: |
        cd rancher-catalog
        
        git config user.name "AskMe Release Bot"
        git config user.email "noreply@avanteam.com"
        
        # Check if there are changes to commit
        if git diff --quiet && git diff --staged --quiet; then
          echo "📋 Aucun changement détecté dans le catalog"
          exit 0
        fi
        
        git add .
        git commit -m "🚀 chore: update AskMe to version ${{ steps.version.outputs.version }}

        - Updated Chart.yaml version to ${{ steps.version.outputs.version }}
        - Updated values.yaml image tag to ${{ steps.version.outputs.version }}
        - Restored previous chart packages to preserve version history
        - Generated new Helm package askme-${{ steps.version.outputs.version }}.tgz
        - Updated index.yaml with ALL versions (cumulative)
        - Fixed URLs to use raw.githubusercontent.com for proper access
        - Synchronized with AskMe tag v${{ steps.version.outputs.version }}
        
        Auto-generated by GitHub Actions
        Source: ${{ github.repository }}@${{ github.sha }}"
        
        # Créer le tag synchronisé (priorité absolue)
        echo "🏷️ Création du tag synchronisé v${{ steps.version.outputs.version }}..."
        git tag -f v${{ steps.version.outputs.version }} # Force overwrite si existe
        git push origin v${{ steps.version.outputs.version }} --force
        
        # Optionnel: Merge vers prod SEULEMENT si pas de conflit
        echo "🔄 Tentative de merge vers prod (non-bloquant)..."
        if git push origin HEAD:prod 2>/dev/null; then
          echo "✅ Merge vers prod réussi"
        else
          echo "⚠️  Merge vers prod échoué (conflit) - tag créé avec succès"
          echo "📋 Action manuelle requise pour merger vers prod"
        fi
        
        echo "✅ Tag synchronisé v${{ steps.version.outputs.version }} créé avec succès"
        echo "📦 Correspondance: askme:v${{ steps.version.outputs.version }} ↔ catalog:v${{ steps.version.outputs.version }}"

  # Job 4: Notification de build
  notify:
    name: 📢 Notification
    runs-on: ubuntu-latest
    needs: [test, build, update-catalog]
    # Seulement si des jobs build ont été exécutés
    if: always() && needs.build.result != 'skipped'
    
    steps:
    - name: 📧 Notification de succès
      if: needs.build.result == 'success'
      run: |
        echo "✅ Build réussi !"
        echo "🐳 Image Docker : ${{ needs.build.outputs.image-tag }}"
        echo "📦 Image disponible dans Harbor Registry"
        
        if [[ "${{ needs.update-catalog.result }}" == "success" ]]; then
          echo "📦 Catalog Rancher synchronisé avec succès"
          echo "🌐 Nouvelle version disponible dans Rancher UI"
        elif [[ "${{ needs.update-catalog.result }}" == "skipped" ]]; then
          echo "📦 Synchronisation catalog ignorée (push sur branche, pas tag)"
        else
          echo "⚠️ Problème avec la synchronisation du catalog"
        fi

    - name: 📧 Notification d'échec
      if: needs.build.result == 'failure'
      run: |
        echo "❌ Build échoué !"
        echo "🔍 Vérifiez les logs des étapes précédentes"