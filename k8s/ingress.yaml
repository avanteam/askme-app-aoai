# Ingress pour OVH Kubernetes avec NGINX Ingress Controller
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: askme-ingress
  namespace: askme-app
  annotations:
    # OVH utilise généralement nginx comme ingress controller
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Augmenter les timeouts pour les requêtes streaming LLM
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    # Support des Server-Sent Events pour le streaming
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-cache: "off"
    # Taille maximum des uploads (pour les images)
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # Configuration CORS pour les requêtes cross-origin
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    # Utilisation de cert-manager pour SSL automatique
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  # Configuration TLS avec cert-manager
  tls:
  - hosts:
    - askme.avanteam-online.com
    secretName: askme-tls
  rules:
  - host: askme.avanteam-online.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: askme-service
            port:
              number: 80