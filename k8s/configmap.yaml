apiVersion: v1
kind: ConfigMap
metadata:
  name: askme-config
  namespace: askme-app
data:
  # Debug Configuration
  DEBUG: "True"
  
  # UI Configuration
  UI_TITLE: "Avanteam AskMe"
  UI_LOGO: "https://aimanager-dev.avanteam-online.com/app/custom/ai/shareddata/logoavanteamai.png"
  UI_CHAT_LOGO: "https://aimanager-dev.avanteam-online.com/app/custom/ai/shareddata/logoBot.gif"
  UI_CHAT_TITLE: "Commencer une discussion"
  UI_CHAT_DESCRIPTION: "Cet assistant Quality SaaS est configuré pour répondre à vos questions sur la documentation Avanteam"
  UI_FAVICON: ""
  UI_SHOW_SHARE_BUTTON: "False"
  UI_SHOW_EXPORT_BUTTON: "True"
  
  # LLM Configuration
  LLM_PROVIDER: "AZURE_OPENAI"
  AVAILABLE_LLM_PROVIDERS: "AZURE_OPENAI,CLAUDE,OPENAI_DIRECT,MISTRAL,GEMINI"
  
  # Data Source Configuration
  DATASOURCE_TYPE: "AzureCognitiveSearch"
  SEARCH_TOP_K: "10"
  SEARCH_STRICTNESS: "3"
  SEARCH_ENABLE_IN_DOMAIN: "True"
  
  # Voice Features Configuration
  VOICE_INPUT_ENABLED: "true"
  WAKE_WORD_ENABLED: "true"
  WAKE_WORD_PHRASES: "Sarah,Richard,Patrick,Mérade"
  WAKE_WORD_VARIANTS: "mérade|merad|merrad|meraad|mehraad|mehrad,richard|richart|richar|rishar,patrick|patrick|patrik"
  
  # Azure Speech Configuration
  AZURE_SPEECH_ENABLED: "true"
  AZURE_SPEECH_VOICE_FR: "fr-FR-HenriNeural"
  AZURE_SPEECH_VOICE_EN: "en-US-GuyNeural"
  
  # Language Detection Configuration
  DEFAULT_LANGUAGE: "en"
  
  # Citation Configuration
  CITATION_CONTENT_MAX_LENGTH: "2000"
  
  # Image Upload Configuration
  IMAGE_MAX_SIZE_MB: "12.0"
  
  # Authentication Configuration
  AUTH_ENABLED: "false"
  AZURE_USE_AUTHENTICATION: "false"
  
  # Application Settings
  CHAT_HISTORY_ENABLED: "true"
  ORCHESTRATION_STRATEGY: "openai_function"
  SCM_DO_BUILD_DURING_DEPLOYMENT: "true"
  
  # Prompt Flow Configuration (disabled)
  USE_PROMPTFLOW: "False"
  PROMPTFLOW_RESPONSE_TIMEOUT: "120"
  PROMPTFLOW_REQUEST_FIELD_NAME: "query"
  PROMPTFLOW_RESPONSE_FIELD_NAME: "reply"
  PROMPTFLOW_CITATIONS_FIELD_NAME: "documents"