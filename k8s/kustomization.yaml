# Kustomization pour différents environnements
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: askme-app-base

# Ressources de base
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Labels communs à toutes les ressources
commonLabels:
  app: askme-app
  version: v1.0.0
  managed-by: kustomize

# Annotations communes
commonAnnotations:
  app.kubernetes.io/name: askme-app
  app.kubernetes.io/component: web-application
  app.kubernetes.io/part-of: askme-platform

# Préfixe pour les noms des ressources (optionnel)
# namePrefix: prod-

# Images à remplacer
images:
  - name: your-registry/askme-app
    newTag: latest

