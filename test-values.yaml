# Configuration test pour validation App Store AskMe  
client:
  name: "askme-demo"
  namespace: "askme-app"
  domain: "askme-demo.avanteam-online.com"

# Configuration basique pour test
app:
  azureUseAuthentication: false
  enableChatHistory: false
  
# LLM Provider de test (Claude)
llm:
  defaultProvider: "CLAUDE"
  availableProviders: "CLAUDE,AZURE_OPENAI"
  
# Configuration Claude minimale (utiliser des vraies clés pour test complet)
claude:
  apiKey: "test-key-placeholder"
  model: "claude-3-sonnet-20240229"

# Azure OpenAI backup  
azureOpenAI:
  endpoint: "https://test.openai.azure.com"
  key: "test-key-placeholder"
  model: "gpt-4"

# Ressources minimales pour test
resources:
  requests:
    cpu: "200m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

replicaCount: 1

# Pas de persistance pour test
persistence:
  enabled: false