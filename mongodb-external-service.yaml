---
# Service ExternalName pour accès depuis le namespace askme-app
apiVersion: v1
kind: Service
metadata:
  name: mongodb-external
  namespace: askme-app
spec:
  type: ExternalName
  externalName: mongodb-shared.askme-mongodb.svc.cluster.local
  ports:
  - name: mongodb
    port: 27017
    targetPort: 27017
    protocol: TCP

---
# Secret pour les credentials MongoDB (à utiliser dans askme-app)
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  namespace: askme-app
type: Opaque
stringData:
  mongodb-root-password: "AskMe-MongoDB-2024-Secure!"
  mongodb-uri: "mongodb://root:AskMe-MongoDB-2024-Secure!@mongodb-external:27017/?replicaSet=rs0&readPreference=secondaryPreferred"